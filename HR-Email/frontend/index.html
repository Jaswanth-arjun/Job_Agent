<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TalentFlow Pro — HR Outreach & Talent Intelligence Platform</title>
    <meta name="description" content="Enterprise HR Outreach & Candidate Networking Automation Platform">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <div class="logo-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
                        </svg>
                    </div>
                    <div class="logo-brand">
                        <span class="logo-text">TalentFlow</span>
                        <span class="logo-badge">PRO</span>
                    </div>
                </div>
            </div>
            
            <div class="sidebar-nav-container">
                <div class="sidebar-section-title">OUTREACH SUITE</div>
                <nav class="sidebar-nav">
                    <button class="nav-btn active" data-page="dashboard" id="nav-dashboard">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/></svg>
                        <span>Dashboard</span>
                    </button>
                    <button class="nav-btn" data-page="upload" id="nav-upload">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                        <span>Import PDF</span>
                    </button>
                    <button class="nav-btn" data-page="contacts" id="nav-contacts">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4-4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
                        <span>Contacts Directory</span>
                    </button>
                    <button class="nav-btn" data-page="send" id="nav-send">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                        <span>Outreach Queue</span>
                    </button>
                    <button class="nav-btn" data-page="followups" id="nav-followups">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
                        <span>Follow-ups Engine</span>
                    </button>
                </nav>
                
                <div class="sidebar-section-title" style="margin-top: 20px;">INTELLIGENCE & SETUP</div>
                <nav class="sidebar-nav">
                    <button class="nav-btn" data-page="assistant" id="nav-assistant">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                        <span>AI Copilot (RAG)</span>
                    </button>
                    <button class="nav-btn" data-page="settings" id="nav-settings">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
                        <span>Settings</span>
                    </button>
                </nav>
            </div>
            
            <div class="sidebar-footer">
                <div class="auth-status" id="auth-status">
                    <div class="auth-dot disconnected"></div>
                    <span>Gmail: Checking...</span>
                </div>
            </div>
        </aside>

        <!-- Main Wrapper with Header & Pages -->
        <div class="main-wrapper">
            <header class="top-header">
                <div class="top-header-left">
                    <div class="live-status-pill">
                        <span class="pulse-ring"></span>
                        <span class="live-status-text">CAMPAIGN ENGINE ACTIVE</span>
                    </div>
                </div>
                <div class="top-header-right">
                    <button class="header-action-btn" onclick="doCheckReplies()" title="Sync Gmail Replies Now">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
                        <span>Sync Replies</span>
                    </button>
                    <div class="user-profile-badge">
                        <div class="user-avatar">TF</div>
                        <div class="user-info">
                            <span class="user-name">TalentFlow Hub</span>
                            <span class="user-role">Enterprise Automation</span>
                        </div>
                    </div>
                </div>
            </header>

            <main class="main-content">
                <!-- Toast container -->
                <div id="toast-container"></div>

                <!-- Pages -->
                <div id="page-dashboard" class="page active"></div>
                <div id="page-upload" class="page"></div>
                <div id="page-contacts" class="page"></div>
                <div id="page-send" class="page"></div>
                <div id="page-followups" class="page"></div>
                <div id="page-assistant" class="page"></div>
                <div id="page-settings" class="page"></div>
            </main>
        </div>
    </div>

    <div class="modal-overlay" id="modal-overlay">
        <div class="modal" id="modal-content"></div>
    </div>

    <script src="pages1.js"></script>
    <script src="pages2.js"></script>
    <script src="app.js"></script>
</body>
</html>
